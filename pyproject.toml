[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "internal-moe-inference-service"
version = "0.1.0"
description = "Offline-capable, manifest-verified LLM inference service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}
dependencies = [
  "accelerate==1.14.0",
  "boto3==1.43.73",
  "fastapi==0.141.1",
  "filelock==3.32.3",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "python-json-logger==4.2.0",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.14.0",
  "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
test = [
  "bandit[toml]==1.9.4",
  "httpx2==2.10.0",
  "moto[s3]==5.2.2",
  "mypy==2.3.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "pyyaml==6.0.3",
  "ruff==0.16.3",
]

[project.scripts]
inference-service = "inference_service.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_service"]

[tool.hatch.build.targets.sdist]
include = [
  ".dockerignore",
  ".env.example",
  ".env.qwen.example",
  ".github",
  "Dockerfile",
  "Makefile",
  "README.md",
  "THIRD_PARTY_NOTICES.md",
  "artifacts/verification",
  "docker-compose.yml",
  "docs",
  "pyproject.toml",
  "requirements.lock",
  "scripts",
  "src",
  "tests",
  "uv.lock",
  "vendor",
]
exclude = ["artifacts/test-model", "pytest-of-root"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "tiny_model: executes a locally generated real model on CPU",
  "gpu: requires CUDA",
  "external_checkpoint: requires user-supplied model artifacts",
  "slow: long-running validation",
]

[tool.coverage.run]
branch = true
source = ["inference_service"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603"]
"scripts/create_tiny_test_model.py" = ["S106", "S311"]
"scripts/run_tiny_model_smoke.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inference_service"]
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
