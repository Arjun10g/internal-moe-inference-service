name: Validate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.11.7'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --extra test
      - name: Lint
        run: make lint
      - name: Type-check
        run: make typecheck
      - name: Test
        run: make test
      - name: Scan source
        run: make security
      - name: Audit dependencies
        run: make audit
      - name: Verify pinned llama.cpp runtime
        run: make llama-runtime
      - name: Verify approved Qwen GCP pointer
        run: make qwen-check
